<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Biblioteca</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="topAppBar">
    <button id="hamburgerBtn" data-i18n-title="hamburgerTitle" aria-label="Menu">☰</button>
    <h1 id="appBarTitle" data-i18n="appTitle">📚 La Mia Biblioteca</h1>
    <div class="topbar-icons">
      <button id="searchIconBtn" data-i18n-title="searchTitle">🔍</button>
      <button id="sortIconBtn" data-i18n-title="sortTitle">↕️</button>
      <button id="viewToggleBtn" data-i18n-title="viewToggleTitle">🔲</button>
    </div>
  </header>

  <div id="drawerOverlay" class="drawer-overlay" hidden></div>
  <nav id="sideDrawer" class="side-drawer" hidden>
    <div class="drawer-header">
      <span data-i18n="menuTitle">Menu</span>
      <button id="closeDrawerBtn" data-i18n-title="closeDrawerTitle" aria-label="Chiudi">✕</button>
    </div>

    <div class="drawer-section">
      <div class="drawer-label" data-i18n="drawerLangLabel">Lingua</div>
      <div class="lang-dropdown">
        <button id="langToggle" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="langToggleFlag">🇮🇹</span>
          <span id="langToggleLabel">Italiano</span>
          <span class="arrow">▾</span>
        </button>
        <div id="langMenu" hidden>
          <button type="button" class="lang-option" data-lang="it">🇮🇹 Italiano</button>
          <button type="button" class="lang-option" data-lang="en">🇬🇧 English</button>
        </div>
      </div>
    </div>

    <button id="drawerToggleStats" class="drawer-item"></button>
    <button id="drawerImportExport" class="drawer-item" data-i18n="drawerImportExport">Importa / Esporta</button>
    <button id="drawerDrive" class="drawer-item" data-i18n="drawerDrive">Google Drive</button>
  </nav>

  <!-- Hidden file input used by the Import flow (Step 13). Triggered
       programmatically when the person picks "Importa XLSX" from the
       Import/Export chooser modal. -->
  <input type="file" id="importFileInput" accept=".xlsx" hidden>

  <div class="page-content">

    <div id="statsBar">
      <div class="stat-box">
        <span class="stat-number" id="statTotal">0</span>
        <span class="stat-label" data-i18n="statTotalLabel">Totale</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="statRead">0</span>
        <span class="stat-label" data-i18n="statReadLabel">Letti</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="statOwned">0</span>
        <span class="stat-label" data-i18n="statOwnedLabel">Posseduti</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="statOnLoan">0</span>
        <span class="stat-label" data-i18n="statOnLoanLabel">In prestito</span>
      </div>
    </div>

    <div id="mainTabs">
      <button class="tab-btn" data-tab="shelves" data-i18n="tabShelves">Scaffali</button>
      <button class="tab-btn active" data-tab="books" data-i18n="tabBooks">Libri</button>
    </div>

    <div id="pathRow">
      <span id="breadcrumb"></span>
      <span id="itemCount"></span>
      <button id="filterBtn" data-i18n-title="filterTitle">▽</button>
    </div>

    <section id="shelvesView" class="tab-view" hidden>
      <div id="shelfAddRow">
        <input type="text" id="newShelfInput" data-i18n-placeholder="newShelfPh" placeholder="Nuovo scaffale">
        <button id="addShelfBtn" type="button" data-i18n="addShelfBtn">Aggiungi scaffale</button>
      </div>
      <ul id="shelfList"></ul>
      <p id="noShelvesMsg" style="display:none;" data-i18n="noShelvesMsg">Nessuno scaffale creato.</p>
    </section>

    <section id="booksView" class="tab-view">
      <div id="booksContent">
        <div id="bookGroups"></div>
        <div id="azIndex"></div>
      </div>
      <p id="emptyMsg" style="display:none;" data-i18n="emptyMsg">Nessun libro ancora. Aggiungine uno sopra!</p>
    </section>

  </div>

  <button id="fabAdd" data-i18n-title="fabAddTitle">+</button>

  <div id="addPanelOverlay" class="modal-overlay" hidden>
    <div class="add-panel">
      <div class="add-panel-header">
        <span id="addPanelTitle" data-i18n="addBookTitle">Aggiungi libro</span>
        <button id="closeAddPanelBtn" data-i18n-title="closeAddPanelTitle">✕</button>
      </div>

      <div class="add-panel-tabs">
        <button type="button" class="add-tab-btn active" data-tab="manual" data-i18n="addTabManual">Inserimento manuale</button>
        <button type="button" id="searchTitleTabBtn" class="add-tab-btn" data-tab="searchTitle" data-i18n="addTabSearchTitle">Cerca per titolo</button>
        <button type="button" id="searchIsbnTabBtn" class="add-tab-btn" data-tab="searchIsbn" data-i18n="addTabSearchIsbn">Cerca per ISBN</button>
        <button type="button" id="scanIsbnTabBtn" class="add-tab-btn" data-tab="scanIsbn" data-i18n="addTabScan">Scansiona ISBN</button>
      </div>

      <div id="searchTitlePanel" class="add-search-panel" hidden>
        <div class="search-row">
          <input type="text" id="searchTitleInput" data-i18n-placeholder="searchTitlePh" placeholder="Titolo del libro">
          <button type="button" id="searchTitleBtn" data-i18n="searchBtn">Cerca</button>
        </div>
        <div id="searchTitleResults" class="search-results"></div>
      </div>

      <div id="searchIsbnPanel" class="add-search-panel" hidden>
        <div class="search-row">
          <input type="text" id="searchIsbnInput" data-i18n-placeholder="searchIsbnPh" placeholder="ISBN">
          <button type="button" id="searchIsbnBtn" data-i18n="searchBtn">Cerca</button>
        </div>
        <div id="searchIsbnResults" class="search-results"></div>
      </div>

      <div id="scanIsbnPanel" class="add-search-panel" hidden>
        <div id="scanVideoWrap">
          <video id="scanVideo" playsinline muted></video>
          <button type="button" id="scanStopBtn" data-i18n="scanStopBtn">Ferma scansione</button>
        </div>
        <button type="button" id="scanStartBtn" data-i18n="scanStartBtn">Avvia scansione</button>
        <p id="scanStatus" class="search-status" style="display:none;"></p>
      </div>

      <div id="manualTabPanel">
        <form id="addForm">
          <input type="text" id="titleInput" data-i18n-placeholder="phTitle" placeholder="Titolo" required>
          <input type="text" id="authorInput" data-i18n-placeholder="phAuthor" placeholder="Autore" required>
          <input type="text" id="publisherInput" data-i18n-placeholder="phPublisher" placeholder="Editore">
          <input type="text" id="seriesInput" data-i18n-placeholder="phSeries" placeholder="Serie">
          <input type="text" id="volumeInput" data-i18n-placeholder="phVolume" placeholder="Volume">
          <input type="text" id="isbnInput" data-i18n-placeholder="phIsbn" placeholder="ISBN">
          <input type="hidden" id="coverInput" value="">
          <select id="shelfInput"></select>

          <select id="languageInput">
            <option value="Italiano" data-i18n-option="Italiano">Italiano</option>
            <option value="English" data-i18n-option="English">English</option>
            <option value="Français" data-i18n-option="Français">Français</option>
            <option value="Deutsch" data-i18n-option="Deutsch">Deutsch</option>
            <option value="Español" data-i18n-option="Español">Español</option>
          </select>

          <select id="formatInput">
            <option value="Cartaceo" data-i18n-option="Cartaceo">Cartaceo</option>
            <option value="Ebook" data-i18n-option="Ebook">Ebook</option>
            <option value="Audiolibro" data-i18n-option="Audiolibro">Audiolibro</option>
          </select>

          <select id="statusInput">
            <option value="Da leggere" data-i18n-option="Da leggere">Da leggere</option>
            <option value="In lettura" data-i18n-option="In lettura">In lettura</option>
            <option value="Letto" data-i18n-option="Letto">Letto</option>
          </select>

          <select id="ownershipInput">
            <option value="Posseduto" data-i18n-option="Posseduto">Posseduto</option>
            <option value="In prestito" data-i18n-option="In prestito">In prestito</option>
            <option value="Non posseduto" data-i18n-option="Non posseduto">Non posseduto</option>
          </select>

          <button type="submit" id="submitBookBtn" data-i18n="addBtn">Aggiungi</button>
          <button type="button" id="deleteBookBtn" data-i18n="deleteBtn" style="display:none;">Elimina</button>
        </form>
      </div>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <p id="modalMsg"></p>
      <div class="modal-actions">
        <button id="modalBtnSecondary" type="button"></button>
        <button id="modalBtnPrimary" type="button"></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
  <!-- Step 15: Google Identity Services (for Drive sign-in) + our sync logic.
       Loaded after app.js since drive-sync.js calls functions defined there
       (getLang, showModal, renderAll, etc.). -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="drive-sync.js"></script>
</body>
</html>
